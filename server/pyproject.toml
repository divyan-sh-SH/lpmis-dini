[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "homedash-api"
version = "0.1.0"
description = "FastAPI backend for Daily Expense and Carts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.30",
  "psycopg2-binary>=2.9.9",
  "python-dotenv>=1.0.0",
  "mangum>=0.17.0",
  "anthropic>=0.91.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]
